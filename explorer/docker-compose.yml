services:
  explorer:
    build:
      context: ..
      dockerfile: explorer/Dockerfile
    image: ecg-som-explorer
    ports:
      - "8050:8050"
    volumes:
      # Mount data, models, and ablation results read-only at runtime.
      - ../data:/app/data:ro
      - ../models:/app/models:ro
      - ../ablation:/app/ablation:ro
      # Use a local Docker named volume for cache (avoids NFS root_squash PermissionError).
      - explorer_cache:/app/explorer/cache
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "explorer/server.py", "--host", "0.0.0.0", "--port", "8050"]
    restart: unless-stopped

volumes:
  explorer_cache:
