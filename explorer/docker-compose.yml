services:
  explorer:
    build:
      context: ..
      dockerfile: explorer/Dockerfile
    image: ecg-som-explorer
    ports:
      - "8050:8050"
    volumes:
      # Mount data, models and logs read-only so the container can load
      # checkpoints and ECG records without copying them into the image.
      - ../data:/app/data:ro
      - ../models:/app/models:ro
      - ../logs:/app/logs:ro
      # Ablation results CSV (read-only)
      - ../ablation:/app/ablation:ro
      # Cache is written at runtime; keep it on the host between restarts.
      - ./cache:/app/explorer/cache
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "explorer/server.py", "--host", "0.0.0.0", "--port", "8050"]
    restart: unless-stopped
